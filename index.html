<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jupiter Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --text-color: #ffffff;
            --hint-color: #8b9bb4;
            --accent-red: #ff4757;
            --button-color: #2481cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(white, rgba(255,255,255,0.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,0.15) 1px, transparent 30px),
                radial-gradient(rgba(255,255,255,0.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .store-header { text-align: center; margin-bottom: 16px; position: relative; }
        .planet-icon { width: 75px; height: auto; margin-bottom: -12px; filter: drop-shadow(0 0 12px rgba(255,255,255,0.4)); }
        h1.store-title {
            font-family: "Cinzel", "Times New Roman", serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 20%, #b0bec5 60%, #546e7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .store-subtitle { font-size: 10px; letter-spacing: 3px; color: #b0bec5; text-transform: uppercase; margin-top: 4px; font-weight: 600; }

        /* --- 3-Tab Switcher Styling --- */
        .tab-container {
            display: flex;
            background: #161b22;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            border: none;
            color: var(--hint-color);
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(145deg, #238636 0%, #2ea043 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            display: none;
            font-weight: 500;
            backdrop-filter: blur(5px);
        }

        .loading { text-align: center; padding: 50px 0; color: var(--hint-color); font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }

        .card {
            position: relative;
            background: linear-gradient(145deg, #161b22 0%, #0d1117 100%);
            border-radius: 14px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.25);
            border: 1px solid #30363d;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active { transform: scale(0.97); border-color: #58a6ff; }

        .card-number { position: absolute; top: 8px; left: 10px; font-size: 11px; font-weight: 800; color: #8b9bb4; }
        .card-img-wrap {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle, #21262d 0%, #0d1117 100%);
            border: 2px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            margin-top: 4px; margin-bottom: 10px; overflow: hidden;
        }
        .card img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        .card h3 { margin: 0; font-size: 13px; font-weight: 700; color: #f0f6fc; word-break: break-word; }
        .duration { font-size: 10px; font-weight: 700; color: var(--accent-red); margin-top: 4px; }
        .price { font-weight: 800; color: #58a6ff; margin-top: 4px; font-size: 12px; }

        .card-footer-ornament { margin-top: 8px; font-size: 10px; color: #8b9bb4; display: flex; align-items: center; gap: 6px; }
        .card-footer-ornament::before, .card-footer-ornament::after { content: "—"; color: #30363d; }

        .detail-view { 
            display: none; background: linear-gradient(145deg, #161b22 0%, #0d1117 100%); 
            padding: 24px 16px; border-radius: 16px; border: 1px solid #30363d; text-align: center;
        }
        .detail-img-wrap {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #21262d 0%, #0d1117 100%);
            border: 3px solid rgba(255,255,255,0.3); display: inline-flex;
            align-items: center; justify-content: center; margin-bottom: 12px; overflow: hidden;
        }
        .detail-img-wrap img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .note-box { background-color: rgba(255, 193, 7, 0.1); border-left: 4px solid #ffc107; color: #ffecb3; padding: 12px; font-size: 12px; border-radius: 6px; margin: 16px 0; text-align: left; }
        .input-group { margin-top: 16px; text-align: left; }
        .input-group label { font-size: 11px; color: var(--hint-color); display: block; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #ffffff; box-sizing: border-box; font-size: 14px; outline: none; }

        .trust-footer {
            margin-top: 24px; background: linear-gradient(145deg, #161b22 0%, #0d1117 100%);
            border: 1px solid #30363d; border-radius: 12px; padding: 10px 8px;
            display: flex; justify-content: space-around; align-items: center; font-size: 9px; color: #8b9bb4; text-align: center;
        }
        .trust-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    </style>
</head>
<body>

<div class="store-header">
    <svg class="planet-icon" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="65" rx="90" ry="25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" transform="rotate(-15 100 65)"/>
        <circle cx="100" cy="65" r="45" fill="url(#planetGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
        <defs>
            <radialGradient id="planetGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#cfd8dc"/>
                <stop offset="50%" stop-color="#78909c"/>
                <stop offset="100%" stop-color="#263238"/>
            </radialGradient>
        </defs>
    </svg>
    <h1 class="store-title">JUPITER STORE</h1>
    <div class="store-subtitle">✦ PREMIUM DIGITAL PRODUCTS ✦</div>
</div>

<!-- Tab Switcher (3 Tabs) -->
<div id="tabContainer" class="tab-container">
    <button class="tab-btn active" id="tabPremium" onclick="switchTab('PREMIUM')">Premium</button>
    <button class="tab-btn" id="tabService" onclick="switchTab('SERVICE')">Log in Service</button>
    <button class="tab-btn" id="tabGame" onclick="switchTab('GAME')">Game Item</button>
</div>

<button id="backBtn" class="back-btn" onclick="goBack()">← Back</button>
<div id="loading" class="loading">Loading products from Google Sheet...</div>

<div id="productGrid" class="grid"></div>
<div id="categoryGrid" class="grid" style="display: none;"></div>

<div id="detailView" class="detail-view">
    <div>
        <div class="detail-img-wrap">
            <img id="detailLogo" src="" alt="Logo">
        </div>
        <h3 id="productTitle" style="margin: 4px 0; font-size: 16px; color:#f0f6fc;"></h3>
        <div id="productDuration" class="duration" style="font-size: 12px; margin-top: 4px;"></div>
        <div id="productPrice" class="price" style="font-size: 18px; margin-top: 6px;"></div>
    </div>

    <div id="noteBox" class="note-box" style="display:none;"></div>
    
    <div class="input-group">
        <label for="accountData">Account ID / Email / Phone / Remarks:</label>
        <input type="text" id="accountData" placeholder="ဝယ်ယူမည့် အကောင့်အချက်အလက်ထည့်ပါ...">
    </div>
</div>

<div class="trust-footer">
    <div class="trust-item"><span>🛡️</span> 100% SAFE & SECURE</div>
    <div class="trust-item"><span>⚡</span> INSTANT DELIVERY</div>
    <div class="trust-item"><span>🎖️</span> PREMIUM QUALITY</div>
    <div class="trust-item"><span>🎧</span> 24/7 SUPPORT</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e){}

    const BOT_TOKEN = "8872507193:AAFzPJBbCG2pjLtBDvtSakBUqEYKLbHdGks";
    const API_URL = "https://script.google.com/macros/s/AKfycbza9QWfmQBSTiCynzg5XR3-bHwv9OXraPr53fdC8ixW3StWzC6aXL-wa-T9phl8xWbV/exec";
    const QR_IMAGE_URL = "https://kitobokuta.github.io/digital-product-ui/qr.jpg";

    let rawData = [];
    let selectedProduct = null;
    let currentView = 'PRODUCTS';
    let currentTab = 'PREMIUM'; // 'PREMIUM', 'SERVICE', 'GAME'
    let lastSelectedProductName = '';

    function getProp(obj, keys) {
        if (!obj) return "";
        for (let k of keys) {
            for (let prop in obj) {
                if (prop.toLowerCase() === k.toLowerCase()) {
                    let val = obj[prop];
                    if (val !== undefined && val !== null && String(val).trim() !== "") {
                        return String(val).trim();
                    }
                }
            }
        }
        return "";
    }

    function switchTab(tabType) {
        currentTab = tabType;
        document.getElementById('tabPremium').classList.toggle('active', tabType === 'PREMIUM');
        document.getElementById('tabService').classList.toggle('active', tabType === 'SERVICE');
        document.getElementById('tabGame').classList.toggle('active', tabType === 'GAME');
        showProducts();
    }

    function getSvgInitialsLogo(text) {
        const initial = (text || "J").trim().charAt(0).toUpperCase();
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="50" fill="url(#metalGrad)"/>
            <defs>
                <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#374151"/>
                    <stop offset="100%" stop-color="#111827"/>
                </linearGradient>
            </defs>
            <text x="50%" y="54%" font-family="-apple-system, Roboto, sans-serif" font-weight="bold" font-size="44" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${initial}</text>
        </svg>`;
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function resolveLogo(item, categoryName) {
        if (!item) return getSvgInitialsLogo(categoryName);
        let logoVal = getProp(item, ["logo", "image", "img"]);
        if (logoVal !== "") {
            if (logoVal.startsWith("http://") || logoVal.startsWith("https://") || logoVal.startsWith("data:")) return logoVal;
            if (!logoVal.startsWith("images/")) logoVal = "images/" + logoVal;
            return logoVal;
        }
        return getSvgInitialsLogo(getProp(item, ["name", "title"]) || categoryName);
    }

    async function fetchProducts() {
        try {
            const timestampUrl = API_URL + (API_URL.includes("?") ? "&" : "?") + "_t=" + new Date().getTime();
            const response = await fetch(timestampUrl, { redirect: "follow" });
            rawData = await response.json();
            document.getElementById('loading').style.display = 'none';
            showProducts();
        } catch (error) {
            console.error("Fetch error:", error);
            document.getElementById('loading').innerHTML = "Data ရယူ၍ မရနိုင်ပါ။";
        }
    }

    function showProducts() {
        currentView = 'PRODUCTS';
        document.getElementById('tabContainer').style.display = 'flex';
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('productGrid').style.display = 'grid';
        document.getElementById('categoryGrid').style.display = 'none';
        document.getElementById('detailView').style.display = 'none';
        try { tg.MainButton.hide(); } catch(e){}

        const container = document.getElementById('productGrid');
        container.innerHTML = '';

        const uniqueProductsMap = new Map();

        rawData.forEach((prod) => {
            const sheetType = getProp(prod, ["sheet_type", "type"]);
            const prodName = getProp(prod, ["name", "title"]);

            if (!prodName) return;

            // Sheet Name အလိုက် Tab ခွဲခြားခြင်း
            let isMatched = false;
            if (currentTab === 'PREMIUM' && sheetType === "Products Master Database") isMatched = true;
            if (currentTab === 'SERVICE' && sheetType === "Log in Service") isMatched = true;
            if (currentTab === 'GAME' && sheetType === "Game Items") isMatched = true;

            if (isMatched) {
                if (!uniqueProductsMap.has(prodName)) {
                    uniqueProductsMap.set(prodName, prod);
                }
            }
        });

        if (uniqueProductsMap.size === 0) {
            container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--hint-color); padding: 30px;">ယခု Tab တွင် ပစ္စည်းများ မရှိသေးပါ။</div>`;
            return;
        }

        let index = 1;
        uniqueProductsMap.forEach((prod, prodName) => {
            const logoSrc = resolveLogo(prod, prodName);
            const fallbackSrc = getSvgInitialsLogo(prodName);

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-number">${index < 10 ? '0' + index : index}</div>
                <div class="card-img-wrap">
                    <img src="${logoSrc}" alt="${prodName}" onerror="this.onerror=null; this.src='${fallbackSrc}';">
                </div>
                <h3>${prodName}</h3>
                <div class="card-footer-ornament">👑</div>
            `;
            card.onclick = () => showVariants(prodName);
            container.appendChild(card);
            index++;
        });
    }

    function showVariants(prodName) {
        currentView = 'VARIANTS';
        lastSelectedProductName = prodName;
        const matchedItems = rawData.filter(i => getProp(i, ["name", "title"]) === prodName);

        if (matchedItems.length > 0) {
            document.getElementById('tabContainer').style.display = 'none';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('productGrid').style.display = 'none';
            document.getElementById('categoryGrid').style.display = 'grid';
            document.getElementById('detailView').style.display = 'none';

            const container = document.getElementById('categoryGrid');
            container.innerHTML = '';

            matchedItems.forEach((item, index) => {
                const itemCat = getProp(item, ["category", "cat"]) || prodName;
                const itemPrice = getProp(item, ["price", "cost"]) || '0';
                const itemDuration = getProp(item, ["duration", "time"]) || '';
                const logoSrc = resolveLogo(item, itemCat);
                const fallbackSrc = getSvgInitialsLogo(itemCat);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-number">${(index + 1) < 10 ? '0' + (index + 1) : (index + 1)}</div>
                    <div class="card-img-wrap">
                        <img src="${logoSrc}" alt="${itemCat}" onerror="this.onerror=null; this.src='${fallbackSrc}';">
                    </div>
                    <h3>${itemCat}</h3>
                    ${itemDuration ? `<div class="duration">⏱ ${itemDuration}</div>` : ''}
                    <div class="price">${itemPrice} MMK</div>
                    <div class="card-footer-ornament">👑</div>
                `;
                card.onclick = () => showDetail(item);
                container.appendChild(card);
            });
        }
    }

    function showDetail(product) {
        currentView = 'DETAIL';
        selectedProduct = product;
        document.getElementById('tabContainer').style.display = 'none';
        document.getElementById('productGrid').style.display = 'none';
        document.getElementById('categoryGrid').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';

        const prodName = getProp(product, ["name", "title"]);
        const prodCat = getProp(product, ["category", "cat"]);
        const prodPrice = getProp(product, ["price", "cost"]);
        const prodDuration = getProp(product, ["duration", "time"]);
        const prodDesc = getProp(product, ["description", "desc"]);

        document.getElementById('detailLogo').src = resolveLogo(product, prodName);
        document.getElementById('productTitle').innerText = prodCat && prodCat !== prodName ? `${prodName} - ${prodCat}` : prodName;
        document.getElementById('productDuration').innerText = prodDuration ? `⏱ ${prodDuration}` : '';
        document.getElementById('productPrice').innerText = `${prodPrice} MMK`;

        const noteBox = document.getElementById('noteBox');
        if (prodDesc) {
            noteBox.innerHTML = `📌 <b>Condition / Note:</b><br>${prodDesc}`;
            noteBox.style.display = 'block';
        } else {
            noteBox.style.display = 'none';
        }

        try {
            tg.MainButton.setText(`ORDER NOW (${prodPrice} MMK)`);
            tg.MainButton.show();
            tg.MainButton.offClick(sendOrder);
            tg.MainButton.onClick(sendOrder);
        } catch(e){}
    }

    function goBack() {
        if (currentView === 'DETAIL') showVariants(lastSelectedProductName);
        else if (currentView === 'VARIANTS') showProducts();
    }

    async function sendOrder() {
        if (!selectedProduct) return;
        
        const userInput = document.getElementById('accountData').value;
        const prodName = getProp(selectedProduct, ["name", "title"]);
        const prodCat = getProp(selectedProduct, ["category", "cat"]);
        const prodPrice = getProp(selectedProduct, ["price", "cost"]);
        const prodDuration = getProp(selectedProduct, ["duration", "time"]);

        const fullItemName = `${prodName} (${prodCat}${prodDuration ? ' - ' + prodDuration : ''})`;
        const orderId = `ORD-${Math.floor(100000000 + Math.random() * 900000000)}`;

        const user = tg.initDataUnsafe?.user;
        const chatId = user?.id;

        const captionText = `🛒 <b>Order ID:</b> <code>${orderId}</code>\n` +
                            `<b>Item:</b> ${fullItemName}\n` +
                            `<b>Price:</b> ${prodPrice} MMK\n` +
                            `<b>Account/Note:</b> ${userInput || '-'}\n\n` +
                            `📷 <b>ငွေလွှဲပြေစာ နှင့်တကွ နောက်ဆုံး ဂဏန်း ၆ လုံးကို ပို့ပေးပါခဗျာ။</b>`;

        if (chatId) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        photo: QR_IMAGE_URL,
                        caption: captionText,
                        parse_mode: 'HTML'
                    })
                });
            } catch (err){}
        }

        try {
            tg.sendData(JSON.stringify({
                order_id: orderId,
                full_item_name: fullItemName,
                price: prodPrice,
                customer_note: userInput || "-"
            }));
        } catch (e){}

        try { tg.close(); } catch(e){}
    }

    fetchProducts();
</script>
</body>
</html>
