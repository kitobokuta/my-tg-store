<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jupiter Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --text-color: #ffffff;
            --hint-color: #8b9bb4;
            --accent-red: #ff4757;
            --button-color: #2481cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(white, rgba(255,255,255,0.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,0.15) 1px, transparent 30px),
                radial-gradient(rgba(255,255,255,0.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .store-header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }
        .planet-icon {
            width: 75px;
            height: auto;
            margin-bottom: -12px;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.4));
        }
        h1.store-title {
            font-family: "Cinzel", "Times New Roman", serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 20%, #b0bec5 60%, #546e7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .store-subtitle {
            font-size: 10px;
            letter-spacing: 3px;
            color: #b0bec5;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 600;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            display: none;
            font-weight: 500;
            backdrop-filter: blur(5px);
        }

        /* Loading & Error Styles */
        .loading-box {
            text-align: center;
            padding: 40px 20px;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 14px;
            color: var(--hint-color);
            font-size: 14px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .retry-btn {
            background: #238636;
            color: #white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }

        .card {
            position: relative;
            background: linear-gradient(145deg, #161b22 0%, #0d1117 100%);
            border-radius: 14px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.25);
            border: 1px solid #30363d;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:active { transform: scale(0.97); border-color: #58a6ff; }

        .card-number {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 11px;
            font-weight: 800;
            color: #8b9bb4;
            letter-spacing: 0.5px;
        }

        .card-img-wrap {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #21262d 0%, #0d1117 100%);
            border: 2px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .card img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card h3 {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
            color: #f0f6fc;
            word-break: break-word;
            line-height: 1.3;
        }

        .duration { 
            font-size: 10px; 
            font-weight: 700; 
            color: var(--accent-red); 
            margin-top: 4px; 
            letter-spacing: 0.3px;
        }
        .price { 
            font-weight: 800; 
            color: #58a6ff; 
            margin-top: 4px; 
            font-size: 12px; 
        }

        .card-footer-ornament {
            margin-top: 8px;
            font-size: 10px;
            color: #8b9bb4;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-footer-ornament::before, .card-footer-ornament::after {
            content: "—";
            color: #30363d;
        }

        .detail-view { 
            display: none; 
            background: linear-gradient(145deg, #161b22 0%, #0d1117 100%); 
            padding: 24px 16px; 
            border-radius: 16px; 
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .detail-img-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #21262d 0%, #0d1117 100%);
            border: 3px solid rgba(255,255,255,0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .detail-img-wrap img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }

        .note-box {
            background-color: rgba(255, 193, 7, 0.1);
            border-left: 4px solid #ffc107;
            color: #ffecb3;
            padding: 12px;
            font-size: 12px;
            border-radius: 6px;
            margin: 16px 0;
            text-align: left;
            line-height: 1.4;
        }

        .input-group { margin-top: 16px; text-align: left; }
        .input-group label { font-size: 11px; color: var(--hint-color); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus { border-color: #58a6ff; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #2481cc 0%, #1a5f96 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(36, 129, 204, 0.4);
        }
        .submit-btn:active { transform: scale(0.98); }

        .trust-footer {
            margin-top: 24px;
            background: linear-gradient(145deg, #161b22 0%, #0d1117 100%);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 10px 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 9px;
            color: #8b9bb4;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .trust-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .trust-item span { font-size: 13px; }
    </style>
</head>
<body>

<div class="store-header">
    <svg class="planet-icon" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="65" rx="90" ry="25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" transform="rotate(-15 100 65)"/>
        <circle cx="100" cy="65" r="45" fill="url(#planetGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
        <ellipse cx="100" cy="65" rx="90" ry="25" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-dasharray="100 300" transform="rotate(-15 100 65)"/>
        <defs>
            <radialGradient id="planetGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#cfd8dc"/>
                <stop offset="50%" stop-color="#78909c"/>
                <stop offset="100%" stop-color="#263238"/>
            </radialGradient>
        </defs>
    </svg>
    <h1 class="store-title">JUPITER STORE</h1>
    <div class="store-subtitle">✦ PREMIUM DIGITAL PRODUCTS ✦</div>
</div>

<button id="backBtn" class="back-btn" onclick="goBack()">← Back</button>

<!-- Dynamic Status Box -->
<div id="loadingBox" class="loading-box">
    <div class="spinner"></div>
    <div>Google Sheet မှ Data များကို ရယူနေပါသည်...</div>
</div>

<div id="productGrid" class="grid" style="display: none;"></div>
<div id="categoryGrid" class="grid" style="display: none;"></div>

<div id="detailView" class="detail-view">
    <div>
        <div class="detail-img-wrap">
            <img id="detailLogo" src="" alt="Logo">
        </div>
        <h3 id="productTitle" style="margin: 4px 0; font-size: 16px; color:#f0f6fc;"></h3>
        <div id="productDuration" class="duration" style="font-size: 12px; margin-top: 4px;"></div>
        <div id="productPrice" class="price" style="font-size: 18px; margin-top: 6px;"></div>
    </div>

    <div id="noteBox" class="note-box" style="display:none;"></div>
    
    <div class="input-group">
        <label for="accountData">Account ID / Email / Phone / Remarks:</label>
        <input type="text" id="accountData" placeholder="ဝယ်ယူမည့် အကောင့်အချက်အလက်ထည့်ပါ...">
    </div>

    <button id="webSubmitBtn" class="submit-btn" style="display: none;" onclick="sendOrder()">ORDER NOW</button>
</div>

<div class="trust-footer">
    <div class="trust-item"><span>🛡️</span> 100% SAFE & SECURE</div>
    <div class="trust-item"><span>⚡</span> INSTANT DELIVERY</div>
    <div class="trust-item"><span>🎖️</span> PREMIUM QUALITY</div>
    <div class="trust-item"><span>🎧</span> 24/7 SUPPORT</div>
</div>

<script>
    // GOOGLE APPS SCRIPT WEB APP URL
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwl1TYgf-TeZzlka2lq78tXkdXsq9o0S6W-mte9k38Jn431EQvkiMYnDGRerkgismLx/exec";

    let productsDatabase = [];
    let currentView = 'PRODUCTS';
    let lastSelectedProductName = '';
    let selectedProductData = null;

    // Telegram WebApp Handling
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
        try { tg.expand(); tg.ready(); } catch(e){}
    }

    // Dynamic Initial Logo Generator
    function getSvgInitialsLogo(text) {
        const initial = (text || "J").trim().charAt(0).toUpperCase();
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="50" fill="url(#metalGrad)"/>
            <defs>
                <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#374151"/>
                    <stop offset="100%" stop-color="#111827"/>
                </linearGradient>
            </defs>
            <text x="50%" y="54%" font-family="-apple-system, Roboto, sans-serif" font-weight="bold" font-size="44" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${initial}</text>
        </svg>`;
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    // Helper: Safely Map Fields from Google Sheet Response
    function normalizeItem(raw) {
        return {
            id: raw.id || raw.ID || raw.code || raw.Code || "PROD-" + Math.floor(Math.random()*10000),
            name: raw.name || raw.Name || raw.product_name || raw.Item || raw.item || "Unknown Product",
            type: raw.type || raw.Type || raw.category || raw.Category || "Standard",
            duration: raw.duration || raw.Duration || raw.Plan || "N/A",
            priceText: raw.priceText || raw.price || raw.Price || raw.price_text || (raw.sellingPrice ? raw.sellingPrice + " MMK" : "0 MMK"),
            costPrice: raw.costPrice || raw.cost_price || raw.CostPrice || raw.cost || 0,
            note: raw.note || raw.Note || raw.condition || raw.Remark || raw.remark || "-"
        };
    }

    // Fetch Products from Google Sheet API
    async function loadProductsFromSheet() {
        const loadingBox = document.getElementById('loadingBox');
        loadingBox.style.display = 'block';
        loadingBox.innerHTML = `
            <div class="spinner"></div>
            <div>Google Sheet မှ Data များကို ရယူနေပါသည်...</div>
        `;

        try {
            const response = await fetch(SHEET_API_URL);
            if (!response.ok) throw new Error("HTTP Error: " + response.status);

            const data = await response.json();
            
            // Handle array directly or wrapped in data property
            const rawList = Array.isArray(data) ? data : (data.products || data.data || []);
            
            if (rawList.length === 0) {
                loadingBox.innerHTML = `<div>မည့်သည့် Product မှ မတွေ့ရှိပါ သို့မဟုတ် Google Sheet Data လွတ်နေပါသည်။</div>`;
                return;
            }

            productsDatabase = rawList.map(item => normalizeItem(item));
            loadingBox.style.display = 'none';
            renderMainProducts();

        } catch (error) {
            console.error("Fetch Error:", error);
            loadingBox.innerHTML = `
                <div style="color: #ff4757; font-weight: bold; margin-bottom: 8px;">Data ရယူ၍ မရရှိပါ!</div>
                <div style="font-size: 12px;">အင်တာနက် သို့မဟုတ် Google Sheet Link ကို စစ်ဆေးပေးပါ။</div>
                <button class="retry-btn" onclick="loadProductsFromSheet()">ပြန်လည်ကြိုးစားရန်</button>
            `;
        }
    }

    function renderMainProducts() {
        currentView = 'PRODUCTS';
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('productGrid').style.display = 'grid';
        document.getElementById('categoryGrid').style.display = 'none';
        document.getElementById('detailView').style.display = 'none';

        if (tg && tg.MainButton) tg.MainButton.hide();

        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        const uniqueNames = [...new Set(productsDatabase.map(p => p.name))];

        uniqueNames.forEach((name, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => showVariants(name);

            const cardNum = (index + 1) < 10 ? '0' + (index + 1) : (index + 1);
            const logoSrc = getSvgInitialsLogo(name);

            card.innerHTML = `
                <div class="card-number">${cardNum}</div>
                <div class="card-img-wrap">
                    <img src="${logoSrc}" alt="${name}">
                </div>
                <h3>${name}</h3>
                <div class="card-footer-ornament">👑</div>
            `;
            grid.appendChild(card);
        });
    }

    function showVariants(productName) {
        currentView = 'VARIANTS';
        lastSelectedProductName = productName;

        document.getElementById('backBtn').style.display = 'block';
        document.getElementById('productGrid').style.display = 'none';
        document.getElementById('categoryGrid').style.display = 'grid';
        document.getElementById('detailView').style.display = 'none';

        if (tg && tg.MainButton) tg.MainButton.hide();

        const container = document.getElementById('categoryGrid');
        container.innerHTML = '';

        const matchedItems = productsDatabase.filter(p => p.name === productName);

        matchedItems.forEach((item, index) => {
            const cardNum = (index + 1) < 10 ? '0' + (index + 1) : (index + 1);
            const logoSrc = getSvgInitialsLogo(item.name);

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-number">${cardNum}</div>
                <div class="card-img-wrap">
                    <img src="${logoSrc}" alt="${item.type}">
                </div>
                <h3>${item.type}</h3>
                <div class="duration">⏱ ${item.duration}</div>
                <div class="price">${item.priceText}</div>
                <div class="card-footer-ornament">👑</div>
            `;
            card.onclick = () => showDetail(item);
            container.appendChild(card);
        });
    }

    function showDetail(product) {
        currentView = 'DETAIL';
        selectedProductData = product;

        document.getElementById('productGrid').style.display = 'none';
        document.getElementById('categoryGrid').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        document.getElementById('backBtn').style.display = 'block';

        const logoImg = document.getElementById('detailLogo');
        logoImg.src = getSvgInitialsLogo(product.name);

        document.getElementById('productTitle').innerText = `${product.name} - ${product.type}`;
        document.getElementById('productDuration').innerText = `⏱ ${product.duration}`;
        document.getElementById('productPrice').innerText = product.priceText;

        const noteBox = document.getElementById('noteBox');
        if (product.note && product.note !== "-") {
            noteBox.innerHTML = `📌 <b>Condition / Note:</b><br>${product.note}`;
            noteBox.style.display = 'block';
        } else {
            noteBox.style.display = 'none';
        }

        if (tg && tg.MainButton) {
            document.getElementById('webSubmitBtn').style.display = 'none';
            tg.MainButton.setText(`ORDER NOW (${product.priceText})`);
            tg.MainButton.show();
            tg.MainButton.offClick(sendOrder);
            tg.MainButton.onClick(sendOrder);
        } else {
            const webBtn = document.getElementById('webSubmitBtn');
            webBtn.innerText = `ORDER NOW (${product.priceText})`;
            webBtn.style.display = 'block';
        }
    }

    function goBack() {
        if (currentView === 'DETAIL') {
            showVariants(lastSelectedProductName);
        } else if (currentView === 'VARIANTS') {
            renderMainProducts();
        }
    }

    function sendOrder() {
        if (!selectedProductData) return;

        const userInput = document.getElementById('accountData').value.trim() || "-";
        const orderId = `ORD-${Math.floor(100000000 + Math.random() * 900000000)}`;

        const orderData = {
            order_id: orderId,
            full_item_name: `${selectedProductData.name} - ${selectedProductData.type} (${selectedProductData.duration})`,
            price: String(selectedProductData.priceText).replace(/[^0-9]/g, ''),
            cost_price: selectedProductData.costPrice,
            product_note: selectedProductData.note,
            customer_note: userInput
        };

        if (tg && tg.sendData) {
            try {
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            } catch(e) {
                console.error("Telegram sendData error:", e);
            }
        } else {
            alert("Order Submitted (Browser Preview):\n\n" + JSON.stringify(orderData, null, 2));
        }
    }

    // Init App & Fetch Data on Load
    window.addEventListener("DOMContentLoaded", () => {
        loadProductsFromSheet();
    });
</script>
</body>
</html>
